events {
    worker_connections 1024;
}

http {
# какому расширению соответствует какой Content-Type
# наприменр: .css → Content-Type: text/css
    include mime.types; 
# не знаешь, что это за файл — отдай его как application/octet-stream  
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        
        
        location /static/ {
# Когда клиент просит /static/что-то, отдай файл из /app/backend/static/что-то
            alias /app/backend/static/;
# не логировать
            access_log off;
# Сохраняй файл в кэше на 30 дней и не запрашивай заново
            expires 30d;
        }

        location / {
#  Все запросы проксировать к запущенному Django-серверу, 
#  работающему по адресу http://имя-Docker-контейнера:8000
            proxy_pass http://django:8000;
# передает оригинальное имя хоста (например, localhost или example.com)
# от клиента в Django-приложение
            proxy_set_header Host $host;
# передает Django-приложению реальный IP-адрес клиента, подключившегося к Nginx.
            proxy_set_header X-Real-IP $remote_addr;
# Этот заголовок формирует цепочку проксей, через которые прошел запрос.
#            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }


    }
}