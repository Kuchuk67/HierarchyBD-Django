services:
  db:
    restart: always
    image: postgres:16.3-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    hostname: db
    networks:
      - backend
    env_file:
      - ./backend/.env
  django:
    restart: always
    build:
      context: .
      dockerfile: ./Dockerfile
    command: >
            sh -c "cd backend &&
                python manage.py makemigrations  &&
                python manage.py migrate &&
                python manage.py add_user_auto  &&
                python manage.py loaddata test_data/Counterparties_fixture.json  &&
                python manage.py loaddata test_data/Products_fixture.json  &&
                python manage.py loaddata test_data/Partnerships_fixture.json  &&
                gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - 8000:8000
    env_file:
      - ./backend/.env
    networks:
      - backend
    depends_on: 
      - db
networks:
    backend:
        driver: bridge
volumes:
    postgres_data:
